<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="Cabesa.png">
    <link rel="stylesheet" href="CSS/jueguito.css">
    <title>Jueguito Snake</title>
  </head>

  <div id="navbar"></div>  
  <body id="body">
    <div class="superCaja">
      <div class="cajaInputs">
        <div class="inputs">
          <p>Número de columnas:</p>
          <input type="number" name="columnas" id="columnas" min="0" required value="15" min="2"/>
        </div>
        <div class="inputs">
          <p>Número de filas:</p>
          <input type="number" name="filas" id="filas" min="0" required value="10" min="2"/>
        </div>
        <div class="inputs">
          <p>Velocidad inicial [100-900]:</p>
          <input type="number" name="velocidad" id="velocidad" min="100" max="900" required value="600"/>
        </div>
        <button onclick="comprobar()" id="empezar" autofocus> Empezar </button>
        <img src="Lengua.png" class="lengua"></img>
      </div>
      <main id="tablero" style="display: none;"></main>
      <p id="puntuacion" style="display: none;">Usa WASD o las flechas para empezar</p>
      <button onclick="reiniciarJuego()" id="reiniciar" style="display: none;"> Reiniciar </button>
      <div id="puntuaciones"></div>
    </div>

    <footer id="footer"></footer>
    <script src="JS/navbarSerpiente.js"></script>
    <script src="JS/footerSerpiente.js"></script>
    <script src="JS/jueguito.js"></script>
  </body>
</html>
