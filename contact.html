<h1>Danos tu feedback haciendo este formulario :)</h1>
<form id="formulario">
    <label for="Nombre" id="labelNombre">Nombre:</label>
    <input type="text" id="Nombre" name="texto"/>
    <label for="Apellido" id="labelApellido">Apellido:</label>
    <input type="text" id="Apellido" name="texto"/>
    <label for="Fecha" id="labelFecha">Fecha de nacimiento:</label>
    <input type="date" id="Fecha" name="texto"/>
    <label for="Email" id="labelEmail">Email:</label>
    <input type="email" id="Email" name="texto" autocomplete="on"/>

    <br><br>

    <label id="labelProyecto">Proyecto favorito:
    <div class="hobbies">
        <input type="radio" name="hobby" value="Fibonacci">Calculadora Fibonacci<br><br>
        <input type="radio" name="hobby" value="Snake">Jueguito Snake<br><br>
        <input type="radio" name="hobby" value="Atardecer">Atardecer gradiente<br>
    </div></label>

    <br>
    <label for="comentario">Comentario opcional:</label>
    <textarea id="comentario" name="comentario" rows="4" cols="54" style="margin-top: 6px;"></textarea>
    <br>

    <label>
        <input type="checkbox" id="politicas"/>
        Acepta las políticas de privacidad
    </label>

    <div id="alma" class="hidden">
        <label for="Precio" id="labelPrecio">Una pequeña donación 👉👈? (€):</label>
        <input type="number" id="Precio" placeholder="Pon 0 para no"/>
    </div>
    <button type="submit" id="btnEnviar" disabled>Enviar</button>
</form>
